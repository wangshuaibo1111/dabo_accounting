<!DOCTYPE html>
<html lang='zh-CN'>
<head><meta charset='UTF-8'><title>图标方案预览 - 大博记账</title>
<style>
  body { font-family: sans-serif; background: #1e293b; color: #e2e8f0; text-align: center; padding: 40px; }
  h1 { color: #fbbf24; margin-bottom: 10px; }
  .subtitle { color: #94a3b8; margin-bottom: 40px; }
  .options { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
  .option { background: #334155; border-radius: 20px; padding: 30px; width: 320px; }
  .option h2 { color: #f1f5f9; margin-top: 20px; }
  .option p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
  .icon-preview { width: 200px; height: 200px; margin: 0 auto; }
  .tag { display: inline-block; background: #fbbf24; color: #1e293b; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; margin: 5px; }
  .meaning { margin-top: 12px; font-size: 13px; color: #cbd5e1; line-height: 1.8; }
</style></head>
<body>
  <h1>大博记账 · 图标方案预览</h1>
  <p class='subtitle'>请从以下三个方案中选择一个作为应用图标</p>
  <div class='options'>
    <div class='option'>
      <div class='icon-preview'><svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='gold' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#fbbf24'/>
      <stop offset='50%' style='stop-color:#f59e0b'/>
      <stop offset='100%' style='stop-color:#d97706'/>
    </linearGradient>
    <linearGradient id='redGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#ef4444'/>
      <stop offset='100%' style='stop-color:#dc2626'/>
    </linearGradient>
    <filter id='shadow'><feDropShadow dx='0' dy='4' stdDeviation='8' flood-color='#92400e' flood-opacity='0.3'/></filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx='256' cy='256' r='240' fill='url(#gold)' filter='url(#shadow)'/>
  <!-- 内圈边框 -->
  <circle cx='256' cy='256' r='210' fill='none' stroke='#b45309' stroke-width='3'/>
  <!-- 红色圆底 -->
  <circle cx='256' cy='256' r='160' fill='url(#redGrad)'/>
  <!-- 方孔（古钱币特征） -->
  <rect x='176' y='176' width='160' height='160' rx='20' fill='#fbbf24'/>
  <rect x='196' y='196' width='120' height='120' rx='12' fill='url(#gold)'/>
  <!-- ¥ 符号 -->
  <text x='256' y='290' text-anchor='middle' font-family='serif' font-size='80' font-weight='bold' fill='#92400e'>¥</text>
  <!-- 四角祥云纹饰 -->
  <circle cx='100' cy='100' r='30' fill='#fcd34d' opacity='0.8'/>
  <circle cx='412' cy='100' r='30' fill='#fcd34d' opacity='0.8'/>
  <circle cx='100' cy='412' r='30' fill='#fcd34d' opacity='0.8'/>
  <circle cx='412' cy='412' r='30' fill='#fcd34d' opacity='0.8'/>
  <!-- 外圈文字（隐式） -->
  <circle cx='256' cy='256' r='225' fill='none' stroke='#fcd34d' stroke-width='2' stroke-dasharray='8 8'/>
</svg></div>
      <h2>方案 A：古钱币</h2>
      <span class='tag'>传统</span><span class='tag'>稳重</span>
      <div class='meaning'>外圆内方，中国传统铜钱造型<br>金色象征财富，红色代表鸿运<br>四角祥云，寓意财源滚滚</div>
    </div>
    <div class='option'>
      <div class='icon-preview'><svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='gold2' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' style='stop-color:#fef3c7'/>
      <stop offset='30%' style='stop-color:#fbbf24'/>
      <stop offset='70%' style='stop-color:#f59e0b'/>
      <stop offset='100%' style='stop-color:#b45309'/>
    </linearGradient>
    <filter id='shadow2'><feDropShadow dx='0' dy='6' stdDeviation='12' flood-color='#78350f' flood-opacity='0.25'/></filter>
  </defs>
  <rect width='200' height='200' rx='100' fill='#1e293b'/>
  <!-- 元宝主体 -->
  <ellipse cx='256' cy='230' rx='180' ry='140' fill='url(#gold2)' filter='url(#shadow2)'/>
  <!-- 元宝顶部弧线 -->
  <path d='M 76 230 Q 76 120 256 120 Q 436 120 436 230' fill='#fef3c7'/>
  <!-- 元宝中间鼓出部分 -->
  <ellipse cx='256' cy='280' rx='100' ry='50' fill='#fbbf24'/>
  <!-- ¥ 符号 -->
  <text x='256' y='255' text-anchor='middle' font-family='serif' font-size='72' font-weight='bold' fill='#92400e'>财</text>
  <!-- 底部光泽 -->
  <ellipse cx='256' cy='300' rx='140' ry='30' fill='#d97706' opacity='0.3'/>
</svg></div>
      <h2>方案 B：金元宝</h2>
      <span class='tag'>吉祥</span><span class='tag'>富贵</span>
      <div class='meaning'>中国传统的金元宝造型<br>"财"字点睛，直白有力<br>金色渐变，立体饱满</div>
    </div>
    <div class='option'>
      <div class='icon-preview'><svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#fbbf24'/>
      <stop offset='100%' style='stop-color:#f59e0b'/>
    </linearGradient>
    <filter id='shadow3'><feDropShadow dx='0' dy='4' stdDeviation='10' flood-opacity='0.3'/></filter>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x='20' y='20' width='472' height='472' rx='100' fill='url(#bg)' filter='url(#shadow3)'/>
  <!-- 装饰圆环 -->
  <circle cx='256' cy='256' r='180' fill='none' stroke='#fff' stroke-width='2' opacity='0.3'/>
  <circle cx='256' cy='256' r='155' fill='none' stroke='#fff' stroke-width='1.5' opacity='0.2'/>
  <!-- ¥ 符号 -->
  <text x='256' y='230' text-anchor='middle' font-family='Arial, sans-serif' font-size='140' font-weight='bold' fill='#fff' filter='url(#shadow3)'>¥</text>
  <!-- 底部小字 -->
  <text x='256' y='310' text-anchor='middle' font-family='sans-serif' font-size='28' fill='#fff' opacity='0.7' letter-spacing='12'>大博记账</text>
  <!-- 四个小点装饰 -->
  <circle cx='110' cy='110' r='10' fill='#fff' opacity='0.5'/>
  <circle cx='402' cy='110' r='10' fill='#fff' opacity='0.5'/>
  <circle cx='110' cy='402' r='10' fill='#fff' opacity='0.5'/>
  <circle cx='402' cy='402' r='10' fill='#fff' opacity='0.5'/>
</svg></div>
      <h2>方案 C：现代简约</h2>
      <span class='tag'>简约</span><span class='tag'>大方</span>
      <div class='meaning'>金色圆角方形底 + 白色¥符号<br>底部"大博记账"文字<br>简洁现代，适合PWA风格</div>
    </div>
  </div>
</body></html>
