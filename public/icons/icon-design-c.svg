<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#fbbf24'/>
      <stop offset='100%' style='stop-color:#f59e0b'/>
    </linearGradient>
    <filter id='shadow3'><feDropShadow dx='0' dy='4' stdDeviation='10' flood-opacity='0.3'/></filter>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x='20' y='20' width='472' height='472' rx='100' fill='url(#bg)' filter='url(#shadow3)'/>
  <!-- 装饰圆环 -->
  <circle cx='256' cy='256' r='180' fill='none' stroke='#fff' stroke-width='2' opacity='0.3'/>
  <circle cx='256' cy='256' r='155' fill='none' stroke='#fff' stroke-width='1.5' opacity='0.2'/>
  <!-- ¥ 符号 -->
  <text x='256' y='230' text-anchor='middle' font-family='Arial, sans-serif' font-size='140' font-weight='bold' fill='#fff' filter='url(#shadow3)'>¥</text>
  <!-- 底部小字 -->
  <text x='256' y='310' text-anchor='middle' font-family='sans-serif' font-size='28' fill='#fff' opacity='0.7' letter-spacing='12'>大博记账</text>
  <!-- 四个小点装饰 -->
  <circle cx='110' cy='110' r='10' fill='#fff' opacity='0.5'/>
  <circle cx='402' cy='110' r='10' fill='#fff' opacity='0.5'/>
  <circle cx='110' cy='402' r='10' fill='#fff' opacity='0.5'/>
  <circle cx='402' cy='402' r='10' fill='#fff' opacity='0.5'/>
</svg>